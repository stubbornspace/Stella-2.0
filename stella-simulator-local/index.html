<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Stella Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<link rel="stylesheet" href="styles.css" />
<div class="start" id="start"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">Stella</div>
    <div class="ctx" id="ctx" hidden></div>
    <div class="nav-item active" data-view="letter_target">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M12 9h.01M17 9h.01M7 14h10"/></svg>
      <span>Letter Target</span>
    </div>
    <div class="nav-item" data-view="letter_find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Letter Find</span>
    </div>
    <div class="nav-item" data-view="eye_pong">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Eye Pong</span>
    </div>
    <div class="nav-item" data-view="inhibition_challenge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="5"/><circle cx="12" cy="7" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="17" r="1.3"/></svg>
      <span>Inhibition Challenge</span>
    </div>
    <div class="nav-item" data-view="motor_sequence_builder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="18" r="2"/><path d="M6.5 7.5 10.5 10.5M13.5 13.5 17.5 16.5"/></svg>
      <span>Motor Sequence</span>
    </div>
    <div class="spacer"></div>
    <div class="nav-foot toggle" id="demoToggle">
      <span>Auto-press</span><span class="pill" id="demoPill">ON</span>
    </div>
    <div class="nav-foot patient-only" data-view="history" id="navHistory" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>
      <span>History</span>
    </div>
    <div class="nav-foot" data-view="results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4a2 2 0 0 1-2-2V5h4M18 9h2a2 2 0 0 0 2-2V5h-4M6 3h12v6a6 6 0 0 1-12 0zM12 15v4M8 21h8"/></svg>
      <span>Results</span>
    </div>
    <div class="nav-foot patient-only" id="navLock" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Lock</span>
    </div>
  </aside>

  <main class="main">
    <div class="card" id="config"></div>
    <div class="card results" id="results" hidden></div>
    <div class="card results wide" id="history" hidden></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <button class="close-btn" id="closeBtn" title="Early stop">&times;</button>
  <div class="progress" id="progress"></div>
  <div class="caption" id="caption"></div>
  <div class="board" id="board"></div>
  <div class="sim-note" id="simNote">
    Simulator: click a green / lit key to register a press. On the real keyboard
    the patient presses the physical key.
  </div>
</div>

<script type="module" src="app.js"></script>


</body>
</html>
